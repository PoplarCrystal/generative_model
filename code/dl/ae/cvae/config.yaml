# 模型参数
model:
  model_type: 'cvae1_prior'  # 模型类型选项：
                       # 'cvae': 条件在编码时与输入拼接，先验 p(z)=N(0,I)
                       # 'cvae1': 条件只在解码时使用，先验 p(z)=N(0,I)
                       # 'cvae_prior': 条件在编码时使用，有Prior网络 p(z|c)=N(μ(c),σ(c))
                       # 'cvae1_prior': 条件只在解码时使用，有Prior网络 p(z|c)=N(μ(c),σ(c))
  input_dim: 784  # 28 * 28
  output_dim: 784  # 28 * 28
  n_classes: 10  # 类别数量（MNIST 有 10 个类别）
  condition_encoding_type: 'onehot'  # 条件编码方式：'onehot' 或 'embedding'
  embed_dim: 5  # embedding的维度，仅在 condition_encoding_type='embedding' 时需要（如32, 64等）
  hidden_dim: 128
  latent_dim: 16

# 训练参数
training:
  epochs: 30
  learning_rate: 0.0003  # 3e-4
  batch_size: 32

# 执行控制标志
flags:
  train: false   # 是否训练模型
  infer1: true   # 是否执行推理1：从测试集采样图像，查看重构效果
  infer2: true   # 是否执行推理2：从潜在空间随机采样生成新图像（带条件标签）

# 模型文件
model_file:
  model_name: ''  # 如果为空字符串，会根据 model_type 自动生成（推荐）
                  # 例如：model_type='cvae' -> 'cvae_model.pth'
                  #      model_type='cvae1' -> 'cvae1_model.pth'
                  # 也可以手动指定文件名，但需确保与 model_type 匹配

# 数据参数
data:
  data_dir: '../../data'  # 相对于代码文件的路径

# 可视化参数
visualization:
  sample_size: 16
  nrow: 4

