# 模型参数
model:
  vocab_size: 256  # 像素值的词汇表大小（0-255）
  d_model: 256  # Transformer模型维度
  nhead: 8  # 注意力头数
  num_layers: 4  # Transformer编码器层数
  dim_feedforward: 1024  # 前馈网络维度
  dropout: 0.1  # Dropout比率
  max_len: 1000  # 最大序列长度（用于位置编码）
  seq_len: 784  # 序列长度（MNIST: 28*28=784）

# 训练参数
training:
  epochs: 30
  learning_rate: 0.0001  # 1e-4，Transformer通常使用较小的学习率
  batch_size: 128  # 增加batch size以充分利用GPU

# 执行控制标志
flags:
  train: true   # 是否训练模型
  infer: true   # 是否执行推理：生成新图像

# 模型文件
model_file:
  model_name: 'ar_transformer_model.pth'

# 数据参数
data:
  data_dir: '../../../data'  # 相对于代码文件的路径

# 可视化参数
visualization:
  sample_size: 16  # 生成图像的数量
  nrow: 4  # 显示时每行的图像数量
