model:
  input_dim: 1  # 输入维度（每个像素是1维的连续值[0,1]）
  d_model: 128  # 这里的256->128
  nhead: 4  # 8->4
  num_layers: 2  # 4->2
  dim_feedforward: 512  # 1024->512
  dropout: 0.1  # Dropout比率
  max_len: 1000  # 最大序列长度（用于位置编码）
  seq_len: 784  # 序列长度（MNIST: 28*28=784）

# 训练参数
training:
  epochs: 20 # 稍微增加一点epoch，因为模型变小了，可能需要多一点迭代
  learning_rate: 0.001 # Transformer通常使用较小的学习率，但小模型可以用0.001
  batch_size: 128  # 增加batch size以充分利用GPU

# 执行控制标志
flags:
  train: false   # 是否训练模型
  infer: true   # 是否执行推理：生成新图像

# 模型文件
model_file:
  model_name: 'ar_transformer_model.pth'

# 数据参数
data:
  data_dir: '../../../data'  # 相对于代码文件的路径

# 可视化参数
visualization:
  sample_size: 16  # 生成图像的数量
  nrow: 4  # 显示时每行的图像数量
