# 模型参数
model:
  input_dim: 1  # 输入维度（每个像素是1维的连续值[0,1]）
  hidden_dim: 64  # 因果卷积隐藏层维度 (层数多了，dim减小一点防止过大)
  num_layers: 9  # 因果卷积层数 (我们需要更大的感受野，9层dilation -> 1023 > 784)
  kernel_size: 3  # 卷积核大小
  seq_len: 784  # 序列长度（MNIST: 28*28=784）

# 训练参数
training:
  epochs: 20 # 需要多一点迭代
  learning_rate: 0.001  # 1e-3
  batch_size: 128  # 增加batch size以充分利用GPU

# 执行控制标志
flags:
  train: false   # 是否训练模型
  infer: true   # 是否执行推理：生成新图像

# 模型文件
model_file:
  model_name: 'ar_cnn_model.pth'

# 数据参数
data:
  data_dir: '../../../data'  # 相对于代码文件的路径

# 可视化参数
visualization:
  sample_size: 16  # 生成图像的数量
  nrow: 4  # 显示时每行的图像数量
