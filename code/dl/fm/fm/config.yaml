# 模型参数（与 DDPM 一致，便于复用 UNet）
model:
  img_size: 28
  in_channel: 1
  time_embed_dim: 128

# Flow Matching 参数
flow_matching:
  time_embed_scale: 1000   # t in [0,1] 映射到 [1, time_embed_scale] 供 UNet 时间嵌入
  num_sample_steps: 100    # 采样时 ODE 求解步数

# 训练参数
training:
  epochs: 30
  learning_rate: 0.001
  batch_size: 32

# 执行控制
flags:
  train: true
  infer: true

# 模型文件
model_file:
  model_name: 'flow_matching_model.pth'

# 数据
data:
  data_dir: '../../../data'

# 可视化
visualization:
  sample_size: 16
  nrow: 4
